<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Globedex – prototyp v2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;600;800&family=Playfair+Display:wght@600;700&family=DM+Serif+Display&family=Outfit:wght@600;700&family=Sora:wght@600;700&family=Nunito:wght@400;700&family=Work+Sans:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#e9e5dd;display:grid;place-items:center;font-family:system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
#phone{--r:16px;position:relative;width:min(100vw,430px);height:min(100dvh,900px);overflow:hidden;background:var(--bg);color:var(--tx);font:15px/1.45 var(--fb)}
@media (min-width:520px){#phone{border-radius:44px;border:9px solid #16181b}}
#scr{height:100%;overflow-y:auto;padding:22px 16px 100px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
#scr::-webkit-scrollbar{display:none}
#scr>*{flex-shrink:0}
h2{font:700 28px/1.1 var(--fh);margin:0}
h3{font:700 18px/1.2 var(--fh);margin:0}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;width:100%}
.hero{background:var(--p);color:var(--onp);border-radius:calc(var(--r) + 6px);padding:18px;display:flex;flex-direction:column;gap:10px}
.hero .big{font:700 40px/1 var(--fh)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{font:700 24px/1.1 var(--fh);color:var(--p)}
.eb{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);font-size:13px;font-weight:700;min-height:36px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--p);color:var(--onp);border-color:var(--p)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.soft{background:var(--soft);border:0}
.seg{display:flex;gap:4px;padding:4px;border-radius:calc(var(--r) - 2px);background:var(--tr)}
.seg button{flex:1;text-align:center;padding:9px 4px;border-radius:calc(var(--r) - 6px);font-size:13px;font-weight:700;color:var(--mu);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--sf);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.btn{display:block;text-align:center;padding:13px 16px;border-radius:var(--r);background:var(--p);color:var(--onp);font-weight:800;min-height:48px;text-decoration:none}
.btn.acc{background:var(--a);color:#1b1b1f}
.btn.ghost{background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
.bar{height:8px;border-radius:4px;background:var(--tr);overflow:hidden}
.bar i{display:block;height:100%;background:var(--p);border-radius:4px;transition:width .4s}
.hero .bar{background:rgba(255,255,255,.25)}.hero .bar i{background:var(--a)}
.li{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:12px;min-height:56px;width:100%}
.li .t{flex:1;min-width:0;display:flex;flex-direction:column}
.li b{font-size:15px}
.box{width:28px;height:28px;flex:none;border-radius:9px;border:2px solid var(--mu);display:grid;place-items:center;color:var(--onp)}
.box.on{background:var(--p);border-color:var(--p)}
.badge{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--soft);color:var(--p)}
.chev{color:var(--mu);flex:none}
.back{font-weight:700;color:var(--p);display:flex;align-items:center;gap:4px;min-height:40px;align-self:flex-start}
#nav{position:absolute;left:0;right:0;bottom:0;height:78px;padding:0 6px 12px;display:flex;align-items:center;background:var(--sf);border-top:1px solid var(--ln)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mu);min-height:52px;justify-content:center}
#nav button[aria-pressed="true"]{color:var(--p)}
.map{position:relative;height:290px;border-radius:calc(var(--r) + 6px);overflow:hidden;border:1px solid var(--ln)}
.map svg{width:100%;height:100%;display:block}
.map .zoom{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.pin{cursor:pointer}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.months button{text-align:center;padding:7px 0;border-radius:8px;background:var(--sf);font-size:12px;font-weight:800;min-height:34px}
.months button[aria-pressed="true"]{background:var(--p);color:var(--onp)}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}
.lg span{display:flex;align-items:center;gap:5px}
.lg i{width:10px;height:10px;border-radius:5px;display:block}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs .card{flex:none;width:160px}
.ring{width:76px;height:76px;flex:none;border-radius:50%;display:grid;place-items:center}
.ring span{width:58px;height:58px;border-radius:50%;background:var(--p);display:grid;place-items:center;font:700 16px var(--fh)}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:130px}
.bars div{display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%;font-size:11px;font-weight:700;color:var(--mu)}
.bars i{width:100%;border-radius:6px;display:block}
.bok{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border-radius:var(--r);border:2px solid var(--ln);min-height:128px;text-align:center;font-size:13px;font-weight:700}
.bc .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--tr);color:var(--mu)}
.bc small{font-size:11px}
.idea{min-height:230px;justify-content:flex-end;background:linear-gradient(160deg,var(--p),color-mix(in srgb,var(--p) 68%,var(--a)));width:100%}
.idea .ti{font:700 26px/1.15 var(--fh)}
.idea .chip{background:rgba(255,255,255,.2);border:0;color:inherit;min-height:0;padding:6px 10px;font-size:12px}
.tl>div{border-left:2px solid var(--p);padding:0 0 14px 12px;position:relative}
.tl>div:before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:5px;background:var(--a)}
.tl>div:last-child{border-color:transparent;padding-bottom:0}
.who{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--tr);flex:none}
.who.on{background:var(--p);color:var(--onp)}
#sheet{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
#sheet[hidden]{display:none}
#sheet .in{background:var(--bg);width:100%;max-height:82%;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 16px 26px;display:flex;flex-direction:column;gap:12px;animation:up .25s ease}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--ln);align-self:center}
#sheet p{margin:0}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);padding:11px 18px;border-radius:999px;background:var(--tx);color:var(--bg);font-size:14px;font-weight:700;white-space:nowrap;z-index:7;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
#fx i{position:absolute;top:-20px;border-radius:2px;animation:conf 1.3s ease-in forwards}
@keyframes conf{to{transform:translateY(640px) rotate(620deg);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1;transform:none}}
.leg{opacity:0;transform:translateY(6px);animation:fadein .4s ease forwards}
input,select{font:15px var(--fb);color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;width:100%;min-height:46px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.sw{width:52px;height:52px;border-radius:16px;border:3px solid transparent;display:flex;align-items:flex-end;justify-content:flex-end;padding:4px}
.sw[aria-pressed="true"]{border-color:var(--tx)}
.sw i{width:16px;height:16px;border-radius:8px;border:2px solid #fff;display:block}
.stack{position:relative;height:300px}
.stack .idea{position:absolute;inset:0;border-radius:calc(var(--r) + 8px);padding:18px;display:flex;flex-direction:column;gap:8px;color:var(--onp)}
.stack .under{position:absolute;inset:10px -4px -8px 4px;border-radius:calc(var(--r) + 8px);background:var(--tr);transform:rotate(3deg)}
.rnd{width:60px;height:60px;border-radius:30px;display:grid;place-items:center;background:var(--sf);border:1px solid var(--ln)}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
</style>
</head>
<body>
<div id="phone">
  <div id="scr"></div>
  <nav id="nav" aria-label="Huvudmeny"></nav>
  <div id="sheet" hidden></div>
  <div id="fx"></div>
  <div id="toast" hidden></div>
</div>

 return `<svg viewBox="${eu?'163 14 60 48':'0 6 360 152'}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Karta med era platser"><rect width="360" height="180" style="fill:${sea}"/>
 ${LANDP.map(p=>`<polygon points="${p}" fill="${land}" stroke="${d?'rgba(255,255,255,.12)':'rgba(0,0,0,.1)'}" stroke-width="${eu?.12:.3}" stroke-linejoin="round"/>`).join('')}
 ${WATERP.map(p=>`<polygon points="${p}" style="fill:${sea}"/>`).join('')}
 ${S.playing&&eu?`<path d="M192.9,32.3 L192.3,32.3" stroke="${P.a}" stroke-width=".5" stroke-linecap="round"/><path d="M192.3,32.3 Q186,26.5 184.8,37.7" fill="none" stroke="${P.a}" stroke-width=".45" stroke-linecap="round" pathLength="20" stroke-dasharray="20" stroke-dashoffset="20" style="animation:draw 2.2s ease .6s forwards"/>`:''}
 ${PLACES.map(p=>{const x=(p.lon+180).toFixed(2),y=(90-p.lat).toFixed(2),f=S.mode==='smart'?SMART[p.m[S.month]]:stc(S.status[p.id]);
  return `<g class="pin" ${a('land',{id:p.id})}><circle cx="${x}" cy="${y}" r="${r*2.6}" fill="transparent"/><circle cx="${x}" cy="${y}" r="${r}" style="fill:${f}" stroke="${d?P.sd:'#fff'}" stroke-width="${r/3}"/>${S.mode==='upptack'?`<text x="${(+x+r*1.4).toFixed(2)}" y="${y}" font-size="${eu?1.5:4}" font-weight="700" fill="${d?'#F2EFE9':'#1B1B1F'}" dominant-baseline="middle">${p.city}</text>`:''}</g>`}).join('')}</svg>`}

$('phone').addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='buyform'){const f=new FormData(e.target),n=String(f.get('n')).trim().slice(0,40);if(n){S.buy.push({id:'e'+Date.now(),n,p:Math.max(0,+f.get('p')||0),f:'',d:0});render()}return}if(e.target.id==='recform'){const f=new FormData(e.target),n=String(f.get('n')).trim().slice(0,24);if(n){S.rec.push({n,r:f.get('r'),i:String(f.get('i')).trim().slice(0,60)});S.gift='r'+(S.rec.length-1);render()}return}if(e.target.id==='colform'){const n=String(new FormData(e.target).get('n')).trim().slice(0,30);if(n){ACT.coladd({v:n});render()}return}if(e.target.id==='locform'){const n=String(new FormData(e.target).get('n')).trim().slice(0,40);if(n){ACT.setloc({v:n});render()}return}if(e.target.id==='preform'){const n=String(new FormData(e.target).get('n')).trim().slice(0,60);if(n){S.preL.push(['egen'+Date.now(),n,'Egen punkt']);render()}return}if(e.target.id!=='expform')return;const f=new FormData(e.target),amt=parseFloat(f.get('amt'));if(!(amt>0))return;S.exp.push({n:String(f.get('n')).slice(0,40),amt,cur:f.get('cur'),by:f.get('by'),c:f.get('c')});$('sheet').hidden=true;render();toast('Utgift sparad')});
$('phone').addEventListener('change',e=>{const k=e.target.dataset.fl,q=e.target.dataset.st;const D=e.target.dataset;if(D.cp){if(/^#[0-9a-f]{6}$/i.test(e.target.value))S.cp[D.cp]=e.target.value;render();return}if(D.fo){S[D.fo]=+e.target.value;render();return}if(D.bb){S.buyBud=Math.max(0,+e.target.value||0);render();return}if(e.target.dataset.hp){if(/^\d{4}-\d\d-\d\d$/.test(e.target.value))S.hp.born=e.target.value;render();return}if(k)S.fl[k]=e.target.value;if(q)S.st[q]=e.target.value;if(k||q)render()});
$('phone').addEventListener('input',e=>{if(e.target.id==='rad'){S.rad=+e.target.value;theme();e.target.parentNode.firstChild.textContent='Rundning: '+S.rad+' px'}});
render();
</script>
